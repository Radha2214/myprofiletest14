<html lang="en">

        nav {

        nav ul {

            gap: 25px;
        }

        nav ul li a {

        nav ul li a:hover {

            padding: 100px 20px 40px;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #eff6ff
            );
        }

        .profile-card {
            background: white;
            width: 430px;
            max-width: 95%;
            padding: 40px;
            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.15);

            transition: 0.3s;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* PROFILE IMAGE */

        .profile-img {
            width: 140px;
            height: 140px;

            margin: auto;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 55px;
            font-weight: bold;

            border: 5px solid white;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.2);
        }

        .profile-card h1 {
            margin-top: 20px;
            font-size: 34px;
        }

        .profile-card h3 {
            color: #2563eb;
            margin: 10px 0;
        }

        .profile-card p {
            color: #666;
            line-height: 1.6;
        }

        /* BUTTON */

        .btn {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 28px;

            background: #2563eb;

            color: white;

            border-radius: 25px;

            text-decoration: none;

            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        /* ================= COMMON SECTION ================= */

        section {
            padding: 90px 8%;
        }

        section h2 {
            text-align: center;

            font-size: 32px;

            margin-bottom: 40px;

            color: #111827;
        }

        /* ================= ABOUT ================= */

        .about {
            max-width: 900px;

            margin: auto;

            text-align: center;

            line-height: 1.8;

            color: #555;

            font-size: 17px;
        }

        /* ================= SKILLS ================= */

        .skills-container {
            max-width: 800px;

            margin: auto;
        }

        .skill {
            margin-bottom: 25px;
        }

        .skill-title {
            display: flex;

            justify-content: space-between;

            margin-bottom: 8px;

            font-weight: bold;
        }

        .progress {
            height: 12px;

            background: #ddd;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed
                );

            border-radius: 20px;
        }

        /* ================= PROJECTS ================= */

        .projects {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 25px;
        }

        .project {
            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            transition: 0.3s;
        }

        .project:hover {
            transform: translateY(-8px);

            box-shadow:
                0 12px 25px rgba(0,0,0,0.15);
        }

        .project h3 {
            color: #2563eb;

            margin-bottom: 12px;
        }

        .project p {
            color: #666;

            line-height: 1.6;
        }
